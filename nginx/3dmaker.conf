# Example nginx location block — include inside a server { } that terminates TLS.
# Upstream assumes uvicorn on 127.0.0.1:8090 (see .env HOST/PORT).

location /3dmaker/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /3dmaker;
    proxy_read_timeout 120s;
    client_max_body_size 50m;
}

# Optional: redirect bare prefix without trailing slash
location = /3dmaker {
    return 301 /3dmaker/;
}
